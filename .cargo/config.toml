# Used when building from the workspace root (e.g. ./bevy_screen_frag_chain_demo/deploy.sh).
# Without this, macOS `cc`/`ld` is used for aarch64-unknown-linux-gnu and linking fails
# with "ld: unknown options: --as-needed ...".
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-unknown-linux-gnu-gcc"
rustflags = ["-L", "/Users/userfriendly/cross-libs/aarch64-linux-gnu"]
