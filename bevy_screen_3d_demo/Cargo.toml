[package]
name = "bevy_screen_3d_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.17.3", default-features = false, features = ["bevy_render", "bevy_pbr", "bevy_asset", "png"] }
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
rpi-led-matrix = { version = "0.2", optional = true }

[features]
default = ["window"]
window = ["bevy/bevy_winit", "bevy/bevy_core_pipeline", "bevy/x11"]
matrix = ["rpi-led-matrix"] # Raspberry Pi on headless mode

# Optimize dev builds for faster iteration (Bevy best practice)
[profile.dev]
opt-level = 1

# Even faster compile for quick checks (cargo build --profile dev-fast)
[profile.dev-fast]
inherits = "dev"
opt-level = 0

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 3

