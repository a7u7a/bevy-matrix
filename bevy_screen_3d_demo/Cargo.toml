[package]
name = "bevy_screen_3d_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Base features needed for both window and headless mode
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_core_pipeline",  # Core rendering pipeline
    "bevy_asset",          # Asset management
    "zstd_rust",           # Image compression backend (pure Rust)
] }
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
rpi-led-matrix = { version = "0.2", optional = true }

[features]
default = ["window"]
window = [
    "bevy/bevy_winit",
    "bevy/bevy_render",
    "bevy/bevy_pbr",
    "bevy/x11",
    "bevy/png",
]
# Match my_bevy_game's matrix features for proper 3D rendering
matrix = [
    "rpi-led-matrix",
    "bevy/multi_threaded",
    "bevy/bevy_render",
    "bevy/bevy_pbr",
    "bevy/bevy_scene",
    "bevy/bevy_camera",
    "bevy/bevy_light",
    "bevy/bevy_mesh",
    "bevy/bevy_image",
    "bevy/bevy_shader",
    "bevy/bevy_color",
    "bevy/bevy_window",
    "bevy/png",
    "bevy/tonemapping_luts",
]

# Optimize dev builds for faster iteration (Bevy best practice)
[profile.dev]
opt-level = 1

# Even faster compile for quick checks (cargo build --profile dev-fast)
[profile.dev-fast]
inherits = "dev"
opt-level = 0

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 3

