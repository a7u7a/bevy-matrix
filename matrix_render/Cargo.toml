[package]
name = "matrix_render"
version = "0.1.0"
edition = "2021"
description = "Bevy plugin that renders a camera to an RGB LED matrix via rpi-rgb-led-matrix"
readme = "README.md"
license = "MIT"
repository = "https://github.com/a7u7a/rpi-wgpu"
homepage = "https://github.com/a7u7a/rpi-wgpu"
documentation = "https://docs.rs/matrix_render"
keywords = ["bevy", "led-matrix", "raspberry-pi", "embedded", "wgpu"]
categories = ["game-development", "rendering::graphics-api"]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = false
features = []

[dependencies]
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_render",
    "bevy_camera",
    "bevy_mesh",
    "bevy_image",
    "bevy_shader",
    "bevy_color",
    "bevy_window",
    "zstd_rust",
] }
crossbeam-channel = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rpi-led-matrix = { version = "0.2", optional = true }

[features]
default = []
matrix = ["dep:rpi-led-matrix"]
