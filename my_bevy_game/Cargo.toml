[package]
name = "my_bevy_game"
version = "0.1.0"
edition = "2021"

[dependencies]
# Disable bevy default features - we'll enable only what we need per feature
bevy = { version = "0.17.3", default-features = false, features = [
    "bevy_core_pipeline",  # Core rendering pipeline (needed for both modes during development)
    "bevy_asset",          # Asset management
    "zstd_rust",           # Image compression backend (pure Rust implementation)
] }

[target.'cfg(target_os = "linux")'.dependencies]
rpi-led-matrix = { version = "0.2", optional = true }

[features]
default = ["window"]
# Window mode - enable full rendering, windowing, and default plugins
window = [
    "bevy/bevy_winit",           # Window management
    "bevy/bevy_render",          # Rendering backend
    "bevy/bevy_pbr",             # PBR rendering (for 3D)
    "bevy/bevy_gltf",            # GLTF asset loading
    "bevy/bevy_scene",           # Scene management
    "bevy/default_font",         # Default font for UI
    "bevy/png",                  # PNG texture support
    "bevy/tonemapping_luts",     # Tonemapping
    "bevy/x11",                  # X11 support (Linux desktop)
    "bevy/webgpu",               # WebGPU support (needed for GPU rendering)
]
# Matrix mode - minimal headless features
matrix = [
    "rpi-led-matrix",
    "bevy/multi_threaded",       # Multi-threading support
]

# Optimize dev builds for faster iteration (Bevy best practice)
[profile.dev]
opt-level = 1

# Even faster compile for quick checks (cargo build --profile dev-fast)
[profile.dev-fast]
inherits = "dev"
opt-level = 0

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 3
